name: jtg-spec-server

services:
  flask:
    build:
      context: .
      dockerfile: Dockerfile
    image: jtg-spec-server:latest
    container_name: flask_app
    ports:
      - "${PORT:-5002}:${PORT:-5002}"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-5002}/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
